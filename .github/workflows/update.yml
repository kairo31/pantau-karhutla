name: Perbarui data dan situs

on:
  schedule:
    - cron: "30 3 * * *"          # setiap hari 03:30 UTC = 10:30 WIB
  workflow_dispatch:
    inputs:
      backtest:
        description: "Hitung ulang validasi model (lebih lama)"
        type: boolean
        default: false
      backfill_from:
        description: "Isi ulang titik panas mulai tanggal (YYYY-MM-DD), opsional"
        required: false
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/assets/**"]     # perubahan tampilan ikut dipublikasikan

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Titik panas NASA FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill_from }}
        run: |
          ARGS=""
          if [ "$(date -u +%u)" = "7" ]; then ARGS="--sp-refresh"; fi
          if [ -n "$BACKFILL" ]; then ARGS="$ARGS --backfill-from $BACKFILL"; fi
          python scripts/update_firms.py $ARGS

      - name: Hujan CHIRPS (tidak fatal)
        continue-on-error: true
        run: python scripts/update_rain.py

      - name: ENSO dan IOD (tidak fatal)
        continue-on-error: true
        run: python scripts/update_enso.py

      - name: Prediksi
        env:
          DO_BACKTEST: ${{ github.event.inputs.backtest }}
        run: |
          ARGS=""
          if [ "$(date -u +%u)" = "7" ] || [ "$DO_BACKTEST" = "true" ]; then ARGS="--backtest"; fi
          python scripts/predict.py $ARGS
          python scripts/forecast_monthly.py $ARGS

      - name: Bangun data situs
        run: python scripts/build_data.py

      - name: Simpan perubahan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: pembaruan $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # ambil data yang baru saja di-commit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
